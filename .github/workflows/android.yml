name: Wivori Trails - Godot Android Debug

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container:
      image: barichello/godot-ci:4.4.1
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Check editable sources
        shell: bash
        run: |
          set -euo pipefail
          test -f project.godot
          test -f Main.tscn
          test -f scripts/game.gd

      - name: Setup Godot templates and Android debug signing
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/share/godot/export_templates" "$HOME/.config/godot" "$HOME/.android"
          if [ -d /root/.local/share/godot/export_templates/4.4.1.stable ]; then
            mkdir -p "$HOME/.local/share/godot/export_templates"
            if [ "$HOME" != /root ]; then cp -a /root/.local/share/godot/export_templates/4.4.1.stable "$HOME/.local/share/godot/export_templates/"; fi
          fi
          # Public test-only certificate, deliberately versioned for stable updates.
          cp tools/android/debug.keystore "$HOME/.android/debug.keystore"
          echo "SDK: ${ANDROID_HOME:-/usr/lib/android-sdk}"
          godot --version
          sdkmanager "platforms;android-35" "build-tools;35.0.0" >/dev/null
          SDK_PATH="${ANDROID_HOME:-/usr/lib/android-sdk}"
          JAVA_SDK_PATH="$(dirname "$(dirname "$(readlink -f "$(command -v javac)")")")"
          printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\n' > "$HOME/.config/godot/editor_settings-4.4.tres"
          printf 'export/android/java_sdk_path = "%s"\n' "$JAVA_SDK_PATH" >> "$HOME/.config/godot/editor_settings-4.4.tres"
          printf 'export/android/android_sdk_path = "%s"\n' "$SDK_PATH" >> "$HOME/.config/godot/editor_settings-4.4.tres"
          printf 'export/android/debug_keystore = "%s"\n' "$HOME/.android/debug.keystore" >> "$HOME/.config/godot/editor_settings-4.4.tres"
          printf 'export/android/debug_keystore_user = "androiddebugkey"\n' >> "$HOME/.config/godot/editor_settings-4.4.tres"
          printf 'export/android/debug_keystore_pass = "android"\n' >> "$HOME/.config/godot/editor_settings-4.4.tres"

      - name: Import resources and check GDScript
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --import 2>&1 | tee godot-import.log
          if grep -E 'SCRIPT ERROR:|Parse Error|Failed to load script' godot-import.log; then exit 1; fi
          godot --headless --path . --quit-after 120 2>&1 | tee godot-runtime.log
          if grep -E 'SCRIPT ERROR:|Parse Error|Failed to load script' godot-runtime.log; then exit 1; fi

      - name: Run gameplay regression checks
        shell: bash
        run: |
          set -euo pipefail
          for suite in tests/*_tests.gd; do
            timeout 120 godot --headless --path . --script "res://$suite"
          done 2>&1 | tee godot-tests.log
          if grep -E 'SCRIPT ERROR:|Parse Error|Failed to load script' godot-tests.log; then exit 1; fi

      - name: Export Android APK (debug)
        shell: bash
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          set -euo pipefail
          export GODOT_ANDROID_KEYSTORE_DEBUG_PATH="$HOME/.android/debug.keystore"
          mkdir -p build
          godot --headless --path . --export-debug Android build/WivoriTrails_Android_debug.apk 2>&1 | tee godot-export.log
          test -s build/WivoriTrails_Android_debug.apk
          bash tools/verify_apk.sh build/WivoriTrails_Android_debug.apk \
            "${ANDROID_HOME:-/usr/lib/android-sdk}/build-tools/35.0.0" 2>&1 | tee apk-verification.log

      - name: Upload build logs for diagnosis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WivoriTrails_build_logs
          path: |
            godot-import.log
            godot-runtime.log
            godot-tests.log
            godot-export.log
            apk-verification.log
          if-no-files-found: ignore

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: WivoriTrails_Android_debug
          path: build/WivoriTrails_Android_debug.apk
          if-no-files-found: error
          retention-days: 14

  publish-preview:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: WivoriTrails_Android_debug
          path: release
      - name: Package editable original art and licenses
        shell: bash
        run: |
          set -euo pipefail
          zip -qr release/Wivori_Trails_Art_Source_v0.16.0.zip art assets/fonts assets/models assets/ui -x '*.import' '*.blend[0-9]'
      - name: Publish verified Android preview
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh release view v0.16.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create v0.16.0 release/*.apk release/Wivori_Trails_Art_Source_v0.16.0.zip \
              --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
              --title "Wivori Trails 0.16.0 — nuevo protagonista y revisión visual" \
              --notes-file docs/release-v0.16.md
          fi
