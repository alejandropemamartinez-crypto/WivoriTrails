name: Wivori Trails - Visual Review

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshots:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: barichello/godot-ci:4.4.1
    steps:
      - name: Checkout game
        uses: actions/checkout@v4
      - name: Install virtual display and Mesa
        shell: bash
        run: |
          set -euo pipefail
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq xvfb xauth libgl1-mesa-dri libgl1 mesa-utils >/dev/null
      - name: Import scene
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --import
      - name: Render actual game captures, not mockups
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          MESA_GL_VERSION_OVERRIDE: "3.3"
        run: |
          set -euo pipefail
          mkdir -p previews
          timeout 180 xvfb-run -a -s "-screen 0 720x1280x24" \
            godot --path . --rendering-driver opengl3 --resolution 720x1280 \
            --script res://tools/capture_preview.gd -- "$PWD/previews"
          test -s previews/start.png
          test -s previews/faces.png
          test -s previews/hero_closeup.png
          test -s previews/rabbit_robbery_alert.png
          test -s previews/cash_collection_flight.png
          test -s previews/town_overview.png
          for suite in mobile_ui_tests factory_facade_tests campaign_touch_tests; do
            timeout 120 xvfb-run -a -s "-screen 0 720x1280x24" \
              godot --path . --audio-driver Dummy --resolution 720x1280 \
              --script "res://tests/$suite.gd" 2>&1 | tee "previews/$suite.log"
          done
          for resolution in 720x1280 720x1600; do
            mkdir -p "previews/$resolution"
            timeout 180 xvfb-run -a -s "-screen 0 720x1600x24" \
              godot --path . --audio-driver Dummy --resolution "$resolution" \
              --script res://tools/capture_campaign.gd -- "$PWD/previews/$resolution" \
              2>&1 | tee "previews/campaign-$resolution.log"
            test -s "previews/$resolution/07_puerto_aurora.png"
          done
          if grep -RE 'SCRIPT ERROR:|Parse Error|FAIL:' previews/*.log; then exit 1; fi
      - name: Publish visual screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WivoriTrails_Visual_Snapshots
          path: previews/
          if-no-files-found: warn
          retention-days: 14
