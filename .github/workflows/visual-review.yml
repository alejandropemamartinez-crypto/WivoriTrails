name: Wivori Trails - Visual Review

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshots:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        review: [preview, controls, campaign-720x1280, campaign-720x1600, coastal-720x1280, coastal-720x1600, refuge-720x1280, refuge-720x1600, trade]
    container:
      image: barichello/godot-ci:4.4.1
    steps:
      - name: Checkout game
        uses: actions/checkout@v4
      - name: Install virtual display and Mesa
        shell: bash
        run: |
          set -euo pipefail
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq xvfb xauth libgl1-mesa-dri libgl1 mesa-utils >/dev/null
      - name: Import scene
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --import
      - name: Render actual game captures, not mockups
        shell: bash
        env:
          REVIEW_GROUP: ${{ matrix.review }}
          LIBGL_ALWAYS_SOFTWARE: "1"
          MESA_GL_VERSION_OVERRIDE: "3.3"
          LP_NUM_THREADS: "2"
        run: |
          set -euo pipefail
          mkdir -p previews
          # Software-rendered galleries can exceed three minutes on hosted
          # runners. Keep every capture and assertion, with independent jobs
          # and bounded commands rather than one long sequential gallery.
          case "$REVIEW_GROUP" in
            preview)
              timeout 360 xvfb-run -a -s "-screen 0 720x1280x24" \
                godot --path . --audio-driver Dummy --resolution 720x1280 \
                --script res://tools/capture_preview.gd -- "$PWD/previews" \
                2>&1 | tee previews/preview.log
              for image in start faces hero_closeup rabbit_robbery_alert cash_collection_flight town_overview; do
                test -s "previews/$image.png"
              done
              ;;
            controls)
              for suite in mobile_ui_tests factory_facade_tests campaign_touch_tests hud_overlap_tests terrain_surface_tests; do
                timeout 180 xvfb-run -a -s "-screen 0 720x1280x24" \
                  godot --path . --audio-driver Dummy --resolution 720x1280 \
                  --script "res://tests/$suite.gd" 2>&1 | tee "previews/$suite.log"
              done
              mkdir -p previews/journey
              timeout 240 xvfb-run -a -s "-screen 0 720x1600x24" \
                godot --path . --audio-driver Dummy --resolution 720x1600 \
                --script res://tests/journey_ui_tests.gd -- "$PWD/previews/journey" \
                2>&1 | tee previews/journey-ui.log
              test -s previews/journey/06_siguiente_pueblo.png
              ;;
            trade)
              timeout 240 xvfb-run -a -s "-screen 0 720x1600x24" \
                godot --path . --audio-driver Dummy --resolution 720x1600 \
                --script res://tests/refuge_trade_touch_tests.gd -- "$PWD/previews/trade" \
                2>&1 | tee previews/trade-touch.log
              test -s previews/trade/04_tren_y_automatizacion.png
              test -s previews/trade/06_siguiente_pueblo.png
              ;;
            refuge-*)
              resolution="${REVIEW_GROUP#*-}"
              timeout 240 xvfb-run -a -s "-screen 0 720x1600x24" \
                godot --path . --audio-driver Dummy --resolution "$resolution" \
                --script res://tools/capture_refuge.gd -- "$PWD/previews" \
                2>&1 | tee previews/refuge-captures.log
              timeout 180 xvfb-run -a -s "-screen 0 720x1600x24" \
                godot --path . --audio-driver Dummy --resolution "$resolution" \
                --script res://tests/refuge_ui_tests.gd -- "$PWD/previews/touch" \
                2>&1 | tee previews/refuge-ui.log
              test -s previews/09_expediciones.png
              test -s previews/touch/05_valle_ambar.png
              timeout 180 xvfb-run -a -s "-screen 0 720x1600x24" \
                godot --path . --audio-driver Dummy --resolution "$resolution" \
                --script res://tests/refuge_movement_tests.gd -- "$PWD/previews/movement" \
                2>&1 | tee previews/refuge-movement.log
              test -s previews/movement/03_despues_de_reanudar.png
              ;;
            campaign-*|coastal-*)
              capture="${REVIEW_GROUP%%-*}"
              resolution="${REVIEW_GROUP#*-}"
              timeout 360 xvfb-run -a -s "-screen 0 720x1600x24" \
                godot --path . --audio-driver Dummy --resolution "$resolution" \
                --script "res://tools/capture_$capture.gd" -- "$PWD/previews" \
                2>&1 | tee "previews/$REVIEW_GROUP.log"
              if [[ "$capture" == campaign ]]; then
                test -s previews/07_puerto_aurora.png
              else
                test -s previews/08_distrito_forja.png
              fi
              ;;
          esac
          if grep -RE 'SCRIPT ERROR:|Parse Error|FAIL:' previews/*.log; then exit 1; fi
      - name: Publish visual screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WivoriTrails_Visual_${{ matrix.review }}
          path: previews/
          if-no-files-found: warn
          retention-days: 14
